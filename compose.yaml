# Run with:  docker compose up -d --build   →  http://localhost:8765
# Change the published port with:  PORT=9000 docker compose up -d
services:
  app:
    build: .
    image: db-learning-app:latest
    ports:
      - "${PORT:-8765}:8765"
    restart: unless-stopped
    # The server is stateless (progress lives in each visitor's browser), so no volume is needed.
    # Visitors run code in the app (SQL, mongosh JavaScript), so keep the container locked down:
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
